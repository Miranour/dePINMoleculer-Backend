version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: depin-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: depin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - depin-network

  redis:
    image: redis:7-alpine
    container_name: depin-redis
    ports:
      - "6379:6379"
    command: redis-server --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    networks:
      - depin-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: depin-rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - depin-network

  validator-engine:
    build:
      context: .
      dockerfile: Dockerfile.validator
    container_name: depin-validator
    ports:
      - "50052:50052"
    environment:
      - REDIS_URL=redis://depin-redis:6379
      - SERVER_PORT=50052
    depends_on:
      - redis
    networks:
      - depin-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: depin-backend
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - POSTGRES_URL=postgres://postgres:postgrespassword@depin-postgres:5432/depin_db?sslmode=disable
      - REDIS_URL=depin-redis:6379
      - RABBITMQ_URL=amqp://guest:guest@depin-rabbitmq:5672/
      - VALIDATOR_ADDR=depin-validator:50052
      - JWT_SECRET=super_secret_key_change_me_in_production
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - validator-engine
    networks:
      - depin-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  depin-network:
    driver: bridge
